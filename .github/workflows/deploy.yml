name: Deploy Journal

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd ~/calibexs-journal
            git pull origin main
            npm install
            npx @11ty/eleventy
            sudo chown -R calibexs:www-data /var/www/calibexs/journal
            sudo find /var/www/calibexs/journal -type d -exec chmod 755 {} \;
            sudo find /var/www/calibexs/journal -type f -exec chmod 644 {} \;
